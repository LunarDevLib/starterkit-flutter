name: starterkit_webview
description: Explicit, disconnected native WebView capability for Flutter Starter Kit.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  plugin:
    platforms:
      android:
        package: dev.lunardev.starterkit.webview
        pluginClass: StarterkitWebViewPlugin
      ios:
        pluginClass: StarterkitWebViewPlugin
